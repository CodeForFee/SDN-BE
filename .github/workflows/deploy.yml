# .github/workflows/deploy.yml
name: Auto Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        
      - name: Deploy and Restart Service via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment on VPS..."
            
            DEPLOY_DIR=/var/www/sdn-be
            APP_NAME="My_Node_API"

            cd $DEPLOY_DIR

            # Kéo code mới nhất từ Git
            git pull origin main

            # Cài đặt dependencies (chỉ production)
            npm install --production 

            # Dùng reload để zero-downtime, dùng start nếu chưa chạy
            if /usr/bin/pm2 list | grep -q $APP_NAME; then
                pm2 reload $APP_NAME --update-env 
            else
                pm2 start index.js --name $APP_NAME --update-env 
            fi
            
            echo "Deployment finished. Checking PM2 logs..."
            pm2 logs $APP_NAME --lines 10
            pm2 save
            
            # 🔥 BUỘC PHIÊN SSH PHẢI KẾT THÚC
            exit
